name: Daily News Generate

on:
  schedule:
    - cron: '24 5 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  TZ: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: Fix report date
        run: echo "REPORT_DATE=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Notify Webhook (Start)
        if: env.WEBHOOK_URL != ''
        continue-on-error: true
        env:
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify.mjs start
      - name: Fetch and Generate
        id: generate
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_REQUESTS_PER_MINUTE: ${{ vars.AI_REQUESTS_PER_MINUTE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm generate
      - name: Validate report and site
        id: validate
        if: steps.generate.outputs.status == 'success' || steps.generate.outputs.status == 'partial'
        run: pnpm check && pnpm test && pnpm build
      - name: Commit and Push
        id: commit
        if: steps.generate.outputs.status == 'success' || steps.generate.outputs.status == 'partial'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/daily/ src/content/news/
          if ! git diff --staged --quiet; then
            git commit -m "daily: $REPORT_DATE"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: Notify Webhook (Complete)
        if: success() && steps.generate.outputs.status != 'skipped' && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATION_STATUS: ${{ steps.generate.outputs.status }}
        run: node scripts/notify.mjs "$GENERATION_STATUS"
      - name: Notify Webhook (Failure)
        if: failure() && (steps.generate.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.commit.outcome == 'failure') && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify.mjs failure
      - name: Save run metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-metrics
          path: .cache/run-summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
